<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>figpact 参数调控所见即所得原型 (GUI Prototype)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #4ade80;
      --danger: #f87171;
      --warning: #fbbf24;
      --code-bg: #090d16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo { font-size: 1.15rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
    .badge {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .select-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
    select {
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 460px 1fr 340px;
      flex: 1;
      min-height: 0;
    }
    /* 左侧控件面板 */
    .controls-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.1);
    }
    .panel-title { font-size: 0.9rem; font-weight: 600; }
    .reset-btn, .try-btn {
      padding: 5px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .reset-btn { background: #334155; color: var(--text); }
    .reset-btn:hover { background: #475569; }
    .try-btn { background: var(--primary); color: #04101f; }
    .try-btn:hover { background: var(--primary-hover); }
    .try-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .controls-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .group-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .group-header {
      padding: 8px 12px;
      background: rgba(51, 65, 85, 0.4);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .param-row {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .param-row:last-child { border-bottom: none; }
    .param-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .param-title { font-weight: 500; }
    .param-key { font-size: 0.72rem; color: var(--text-muted); font-family: monospace; }
    .param-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }
    .param-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      height: 4px;
      cursor: pointer;
    }
    input[type="number"] {
      width: 72px;
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.82rem;
      text-align: right;
    }
    .unit-tag { font-size: 0.75rem; color: var(--text-muted); min-width: 28px; }
    /* 开关 switch */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* 中央图表预览 */
    .preview-panel {
      display: flex;
      flex-direction: column;
      background: #0b1120;
      overflow: hidden;
      position: relative;
    }
    .preview-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      gap: 16px;
    }
    .img-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 95%;
      max-height: 85%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .img-card img {
      max-width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 4px;
    }
    .img-tag {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
    }
    .preview-status-bar {
      padding: 8px 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    /* 右侧 QA 与 YAML Patch */
    .right-panel {
      border-left: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: 1px solid var(--border);
    }
    .right-section:last-child { border-bottom: none; }
    .code-box {
      flex: 1;
      background: var(--code-bg);
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      padding: 12px;
      overflow: auto;
      white-space: pre;
      line-height: 1.45;
      user-select: text;
    }
    .qa-box {
      flex: 1;
      background: var(--code-bg);
      padding: 12px;
      overflow: auto;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qa-item {
      padding: 6px 10px;
      border-radius: 4px;
      font-family: monospace;
      line-height: 1.4;
    }
    .qa-pass { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.25); }
    .qa-block { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.25); }
    .qa-movement { background: rgba(56, 189, 248, 0.08); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.2); }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--primary); }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 500;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo">figpact GUI</div>
      <div class="badge">动态参数契约验证 · 原型</div>
      <div class="select-wrap">
        <span>当前图表:</span>
        <select id="figure-select" onchange="changeFigure(this.value)">
          <option value="ftir">Fig.2 FTIR (红外光谱面板)</option>
          <option value="nmr">Fig.2 NMR (核磁共振叠谱)</option>
        </select>
      </div>
      <div class="select-wrap">
        <span>Scope:</span>
        <select id="scope-select" onchange="changeScope(this.value)">
          <option value="main">main</option>
        </select>
      </div>
    </div>
    <div>
      <span id="header-script-info" style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace;"></span>
    </div>
  </header>

  <div class="main-layout">
    <!-- 左侧参数控件 -->
    <div class="controls-panel">
      <div class="panel-header">
        <div class="panel-title">调优控件 (由 JSON 动态生成)</div>
        <div style="display: flex; gap: 8px;">
          <button class="reset-btn" onclick="resetParams()">重置</button>
          <button class="try-btn" id="run-try-btn" onclick="triggerTry()">所见即所得 (Try)</button>
        </div>
      </div>
      <div class="controls-scroll" id="controls-container">
        <!-- 动态注入分组与控件 -->
      </div>
    </div>

    <!-- 中央实时图表 -->
    <div class="preview-panel">
      <div id="loading-mask" class="loading-overlay" style="display: none;">
        <span>⚡ 正在调用 figpact try 试算并重绘图表...</span>
      </div>
      <div class="preview-container">
        <div class="img-card">
          <img id="figure-img" alt="科研图表渲染视图" src="">
          <div class="img-tag" id="img-caption">状态：基线图表</div>
        </div>
      </div>
      <div class="preview-status-bar">
        <div id="preview-status">✓ 准备就绪</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">原尺寸画布 · 当前 scope 预览</div>
      </div>
    </div>

    <!-- 右侧 QA 差异与可复制 YAML Patch -->
    <div class="right-panel">
      <div class="right-section">
        <div class="panel-header">
          <div class="panel-title">实时 YAML Patch</div>
          <button class="copy-btn" onclick="copyPatch()">复制 Patch</button>
        </div>
        <div class="code-box" id="patch-code"># 未发生参数变更</div>
      </div>
      <div class="right-section">
        <div class="panel-header">
          <div class="panel-title">验收与试算差异 (QA / Try Delta)</div>
        </div>
        <div class="qa-box" id="qa-container">
          <div class="qa-item qa-pass">✓ 当前处于基准状态</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentCatalog = null;
    let baselineValues = {};
    let currentValues = {};
    let activeScope = "main";
    let activeFigure = "ftir";
    let paramPaths = {};
    let previewRequest = 0;

    // 页面初始化
    window.addEventListener("DOMContentLoaded", () => {
      loadFigureParams("ftir");
    });

    async function loadFigureParams(figId) {
      activeFigure = figId;
      document.getElementById("figure-select").value = figId;
      document.getElementById("controls-container").innerHTML = "<div style='color: #94a3b8; font-size: 0.85rem;'>正在加载参数清单...</div>";
      try {
        const res = await fetch(`/api/params?figure=${encodeURIComponent(figId)}`);
        currentCatalog = await res.json();
        if (!res.ok) throw new Error(currentCatalog.error);
        document.getElementById("header-script-info").innerText = currentCatalog.script;

        // 设置 scope 下拉列表
        const scopeSelect = document.getElementById("scope-select");
        scopeSelect.innerHTML = "";
        const scopes = Object.keys(currentCatalog.scopes);
        scopes.forEach(sc => {
          const opt = document.createElement("option");
          opt.value = sc;
          opt.innerText = sc;
          scopeSelect.appendChild(opt);
        });
        activeScope = currentCatalog.scope;
        scopeSelect.value = activeScope;

        // 记录初始基线值
        baselineValues = {};
        currentValues = {};
        collectAllCurrentValues();
        paramPaths = {};
        for (const data of Object.values(currentCatalog.scopes)) {
          for (const group of data.groups) {
            for (const param of group.params) {
              paramPaths[param.key] = param.path;
              if (!(param.key in currentValues)) {
                baselineValues[param.key] = structuredClone(param.当前值);
                currentValues[param.key] = structuredClone(param.当前值);
              }
            }
          }
        }

        // 渲染图表
        if (currentCatalog.current_png) {
          document.getElementById("figure-img").src = "data:image/png;base64," + currentCatalog.current_png;
          document.getElementById("img-caption").innerText = `基线渲染 · ${currentCatalog.figure} [${activeScope}]`;
        }

        renderControls();
        updateYamlPatch();
      } catch (err) {
        alert("加载参数失败: " + err);
      }
    }

    function changeFigure(figId) {
      loadFigureParams(figId);
    }

    async function changeScope(sc) {
      activeScope = sc;
      renderControls();
      updateYamlPatch();
      try {
        const res = await fetch(`/api/baseline?figure=${encodeURIComponent(activeFigure)}&scope=${encodeURIComponent(sc)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        if (sc === activeScope) await triggerTry(true);
      } catch (err) {
        alert("Scope 加载失败: " + err);
      }
    }

    function collectAllCurrentValues() {
      const scopeData = currentCatalog.scopes[activeScope];
      if (!scopeData) return;
      scopeData.groups.forEach(grp => {
        grp.params.forEach(p => {
          baselineValues[p.key] = JSON.parse(JSON.stringify(p.当前值));
          currentValues[p.key] = JSON.parse(JSON.stringify(p.当前值));
        });
      });
    }

    function applyAllGaps() {
      const input = document.getElementById("bulk-gap-mm");
      if (!input.value || !input.checkValidity()) { input.reportValidity(); return; }
      const value = Number(input.value);
      for (const group of currentCatalog.scopes[activeScope].groups) {
        for (const param of group.params) {
          if (param.relation_kind) currentValues[param.key] = value;
        }
      }
      renderControls();
      updateYamlPatch();
      triggerTry();
    }

    // 动态生成控件，不硬编码任何参数名
    function renderControls() {
      const container = document.getElementById("controls-container");
      container.innerHTML = "";
      const scopeData = currentCatalog.scopes[activeScope];
      if (!scopeData) return;

      const relations = scopeData.groups.flatMap(g => g.params).filter(p => p.relation_kind);
      if (relations.length) {
        const row = document.createElement("div");
        row.className = "group-card";
        row.innerHTML = `<label for="bulk-gap-mm">全部相邻间距（mm）</label>
          <input id="bulk-gap-mm" type="number" min="0" max="100" step="0.05" placeholder="输入毫米值">
          <button class="try-btn" onclick="applyAllGaps()">应用到本组</button>`;
        container.appendChild(row);
      }
      scopeData.groups.forEach(grp => {
        const card = document.createElement("div");
        card.className = "group-card";

        const gHeader = document.createElement("div");
        gHeader.className = "group-header";
        gHeader.innerText = grp.group;
        card.appendChild(gHeader);

        grp.params.forEach(p => {
          const row = document.createElement("div");
          row.className = "param-row";

          const labelRow = document.createElement("div");
          labelRow.className = "param-label-row";
          labelRow.innerHTML = `
            <span class="param-title">${p.中文名}</span>
            <span class="param-key">${p.key}</span>
          `;
          row.appendChild(labelRow);

          if (p.调大会怎样) {
            const desc = document.createElement("div");
            desc.className = "param-desc";
            desc.innerText = p.调大会怎样;
            row.appendChild(desc);
          }

          const curVal = currentValues[p.key] !== undefined ? currentValues[p.key] : p.当前值;

          if (p.类型 === "bool") {
            const wrap = document.createElement("div");
            wrap.className = "switch-wrap";
            wrap.innerHTML = `
              <label class="switch">
                <input type="checkbox" ${curVal ? "checked" : ""} onchange="onBoolChange('${p.key}', this.checked)">
                <span class="slider"></span>
              </label>
              <span style="font-size: 0.8rem; color: #94a3b8;" id="val-text-${p.key}">${curVal ? "true" : "false"}</span>
            `;
            row.appendChild(wrap);
          } else if (p.类型 === "[dx,dy]") {
            // 双滑块
            const wrap = document.createElement("div");
            wrap.style.display = "flex";
            wrap.style.flexDirection = "column";
            wrap.style.gap = "6px";
            wrap.style.marginTop = "4px";

            const dx = (Array.isArray(curVal) ? curVal[0] : 0) || 0;
            const dy = (Array.isArray(curVal) ? curVal[1] : 0) || 0;

            wrap.innerHTML = `
              <div class="param-input-wrap">
                <span style="font-size: 0.75rem; color: #94a3b8; width: 24px;">dx:</span>
                <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${dx}"
                       oninput="onPairChange('${p.key}', 0, this.value)">
                <input type="number" step="${p.step}" value="${dx}"
                       oninput="onPairChange('${p.key}', 0, this.value)">
                <span class="unit-tag">${p.单位}</span>
              </div>
              <div class="param-input-wrap">
                <span style="font-size: 0.75rem; color: #94a3b8; width: 24px;">dy:</span>
                <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${dy}"
                       oninput="onPairChange('${p.key}', 1, this.value)">
                <input type="number" step="${p.step}" value="${dy}"
                       oninput="onPairChange('${p.key}', 1, this.value)">
                <span class="unit-tag">${p.单位}</span>
              </div>
            `;
            row.appendChild(wrap);
          } else {
            // float / int
            const wrap = document.createElement("div");
            wrap.className = "param-input-wrap";
            wrap.innerHTML = `
              <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${curVal}"
                     id="slider-${p.key}" oninput="onNumberChange('${p.key}', this.value, '${p.类型}')">
              <input type="number" min="${p.min}" max="${p.max}" step="${p.step}" value="${curVal}"
                     id="num-${p.key}" oninput="onNumberChange('${p.key}', this.value, '${p.类型}')">
              <span class="unit-tag">${p.单位}</span>
            `;
            row.appendChild(wrap);
          }

          card.appendChild(row);
        });

        container.appendChild(card);
      });
    }

    function onNumberChange(key, value, type) {
      const v = type === "int" ? parseInt(value, 10) : parseFloat(value);
      currentValues[key] = isNaN(v) ? 0 : v;
      const s = document.getElementById(`slider-${key}`);
      const n = document.getElementById(`num-${key}`);
      if (s && s.value != value) s.value = value;
      if (n && n.value != value) n.value = value;
      updateYamlPatch();
    }

    function onBoolChange(key, checked) {
      currentValues[key] = checked;
      const t = document.getElementById(`val-text-${key}`);
      if (t) t.innerText = checked ? "true" : "false";
      updateYamlPatch();
    }

    function onPairChange(key, idx, val) {
      const v = parseFloat(val) || 0;
      if (!Array.isArray(currentValues[key])) {
        currentValues[key] = [0, 0];
      }
      currentValues[key][idx] = v;
      updateYamlPatch();
    }

    function resetParams() {
      collectAllCurrentValues();
      renderControls();
      updateYamlPatch();
    }

    // 实时构造可复制 YAML Patch
    function updateYamlPatch() {
      const patchObj = {};
      let changedCount = 0;

      for (const [k, val] of Object.entries(currentValues)) {
        const base = baselineValues[k];
        if (JSON.stringify(val) !== JSON.stringify(base)) {
          changedCount++;
          const path = paramPaths[k];
          if (!path) throw new Error(`参数没有 YAML 路径：${k}`);
          let node = patchObj;
          for (const part of path.slice(0, -1)) {
            node = node[part] ??= {};
          }
          node[path[path.length - 1]] = val;
        }
      }

      const box = document.getElementById("patch-code");
      if (changedCount === 0) {
        box.innerText = "# 未发生参数变更 (基线配置)";
        return "";
      }

      function toYaml(obj, indent = 0) {
        let str = "";
        const sp = "  ".repeat(indent);
        for (const [key, value] of Object.entries(obj)) {
          if (typeof value === "object" && value !== null && !Array.isArray(value)) {
            str += `${sp}${key}:\n` + toYaml(value, indent + 1);
          } else if (Array.isArray(value)) {
            str += `${sp}${key}: [${value.join(", ")}]\n`;
          } else {
            str += `${sp}${key}: ${value}\n`;
          }
        }
        return str;
      }

      const yamlStr = toYaml(patchObj);
      box.innerText = yamlStr;
      return yamlStr;
    }

    function copyPatch() {
      const text = document.getElementById("patch-code").innerText;
      navigator.clipboard.writeText(text);
      alert("YAML Patch 已复制到剪贴板！");
    }

    // 触发后端 figpact try
    async function triggerTry(allowUnchanged = false) {
      const patchYaml = updateYamlPatch();
      if (!patchYaml && !allowUnchanged) {
        alert("未修改任何参数，无需试算！");
        return;
      }
      const mask = document.getElementById("loading-mask");
      const btn = document.getElementById("run-try-btn");
      const request = ++previewRequest;
      const figure = activeFigure, scope = activeScope;
      mask.style.display = "flex";
      btn.disabled = true;

      try {
        const res = await fetch("/api/try", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            figure, scope,
            patch_yaml: patchYaml,
            bisection: false // 保持即时响应
          })
        });
        const data = await res.json();
        if (request !== previewRequest || figure !== activeFigure || scope !== activeScope) return;
        if (data.error) {
          alert("试算报错: " + data.error);
          return;
        }

        // 更新新 PNG
        if (data.new_png) {
          document.getElementById("figure-img").src = "data:image/png;base64," + data.new_png;
          document.getElementById("img-caption").innerText = `Try 渲染 · ${data.figure} [${data.scope}] · ${data.qa_delta.status_text}`;
        }

        // 渲染 QA 与位移
        const qaBox = document.getElementById("qa-container");
        qaBox.innerHTML = "";

        // 状态
        const statusItem = document.createElement("div");
        statusItem.className = `qa-item ${data.qa_delta.code_after === 0 ? "qa-pass" : "qa-block"}`;
        statusItem.innerText = `[当前 scope 检查，未正式发布] ${data.qa_delta.status_text} · ${data.seconds.toFixed(2)} 秒`;
        qaBox.appendChild(statusItem);
        for (const relation of data.relations || []) {
          if (relation.scope !== activeScope) continue;
          const item = document.createElement("div");
          item.className = "qa-item qa-movement";
          const kind = relation.kind === "vertical_clearance" ? "曲线包络净距" : "基线间距";
          item.innerText = `${kind} → ${relation.upper}: 实测 ${relation.value_mm.toFixed(3)} mm`;
          qaBox.appendChild(item);
        }
        for (const space of data.space || []) {
          if (space.scope !== activeScope) continue;
          const item = document.createElement("div");
          item.className = `qa-item ${space.overflow_mm > 0 ? "qa-block" : "qa-pass"}`;
          item.innerText = `坐标框剩余：上 ${space.top_mm.toFixed(3)} mm · 下 ${space.bottom_mm.toFixed(3)} mm`
            + `；距画布边：上 ${space.canvas_top_mm.toFixed(3)} mm · 下 ${space.canvas_bottom_mm.toFixed(3)} mm`
            + (space.overflow_mm > 0 ? ` · 超限 ${space.overflow_mm.toFixed(3)} mm；未缩放` : "");
          qaBox.appendChild(item);
        }

        // 新增阻断
        if (data.qa_delta.added && data.qa_delta.added.length > 0) {
          data.qa_delta.added.forEach(item => {
            const it = document.createElement("div");
            it.className = "qa-item qa-block";
            it.innerText = `+ [新增阻断] ${item}`;
            qaBox.appendChild(it);
          });
        }

        // 消除阻断
        if (data.qa_delta.removed && data.qa_delta.removed.length > 0) {
          data.qa_delta.removed.forEach(item => {
            const it = document.createElement("div");
            it.className = "qa-item qa-pass";
            it.innerText = `- [消除阻断] ${item}`;
            qaBox.appendChild(it);
          });
        }

        // 位移变化
        if (data.movements && data.movements.length > 0) {
          data.movements.slice(0, 8).forEach(m => {
            const it = document.createElement("div");
            it.className = "qa-item qa-movement";
            it.innerText = `• [位移] ${m.gid}: ${m.text}`;
            qaBox.appendChild(it);
          });
          if (data.movements.length > 8) {
            const more = document.createElement("div");
            more.className = "qa-item qa-movement";
            more.innerText = `... 还有 ${data.movements.length - 8} 个图元微移`;
            qaBox.appendChild(more);
          }
        } else {
          const noMove = document.createElement("div");
          noMove.className = "qa-item";
          noMove.style.color = "#94a3b8";
          noMove.innerText = "（无图元发生物理中心位移）";
          qaBox.appendChild(noMove);
        }

        document.getElementById("preview-status").innerText = `✓ 试算完成 (位移图元: ${data.movements ? data.movements.length : 0} 个)`;
      } catch (err) {
        alert("请求异常: " + err);
      } finally {
        mask.style.display = "none";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
