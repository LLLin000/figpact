# ══════════════════════════════════════════════════════════════════════════════
# Fig.2 FTIR —— 排版参数（唯一入口）
#
# 改这张图**只改这里**，不要改 plot_ftir.py。
# 手调三步：① `python plot_ftir.py --list-params` 看当前值与范围、看可位移 gid
#          ② 改下面任意一行  ③ `python plot_ftir.py --strict` 看有没有阻断项
#
# 不合法会直接报错并给建议值（未知 key / 缺 key / 非数字 / NaN / 超范围 / 非整数）。
# 数据、峰位、归一化、基线校正**永远不在配置里**，也永远不会进来。
# ══════════════════════════════════════════════════════════════════════════════

schema_version: 2

# ── 画布 ─────────────────────────────────────────────────────────────────────
canvas_w_mm: 48.0          # 单位 mm，范围 20–200。拼版里的**实际占位尺寸**，
                           # 不是"先画大再缩放"。改大 → 面板物理变大，字号不变（字号是 pt）。
canvas_h_mm: 48.0          # 同上。改小 → 坐标框变小，图例+标签占比变大，谱线可用高度变小。

# ── 标注（官能团归属标签：O–H / COO⁻/C=C / COO⁻ / C–O–C / Zn–O）─────────────
label_font_pt: 4.7         # 单位 pt，范围 3.0–12.0。标签块高度与层数可能变化，
                           # 谱线显示标尺固定。空间不足报告超限，不缩小谱线。
                           # 含上下标文字低于出版字号下限时，QA 会报告。
legend_font_pt: 4.7        # 图例字号；改大增加顶部占用，不自动改变曲线幅度。
                           # 请查看实际剩余空间与 QA。
label_edge_margin_mm: 1.5  # 单位 mm，范围 0–6。归属标签距左右坐标框的最小净空。
                           # 挤在右边框上的 Zn–O（400–560 cm⁻¹）靠它往内让。
                           # 改大 → 标签更靠中间，可能改变分层；QA 贴边红线是 1.0 mm。
label_gap_top_mm: 0.5      # 单位 mm，范围 0–8。**图例底 → 标签块顶**的净空。
                           # 图例别压住 O–H 这类要求改这个（不是 curve_gap_mm）。
                           # 调整标签候选布局；不会自动挪动或缩小谱线。

# ── 谱线（五条透过率谱）───────────────────────────────────────────────────────
curve_gap_mm: 0.9          # 标签布局候选净空（mm）；不会自动缩小谱线。
                           # 字号或间距挤不下时，查看实际净距和超限 mm，再自行调整。

# 相邻曲线包络净距（mm，0–100），键是上方曲线 id；不是基线到基线距离。
# GUI 可把一组全部设为同一数值，也可只改一对；增加间距不改变谱线幅度。
clearance_mm:
  main:
    zno: 2.5928677629781425
    hama: 2.5928677629781407
    hama_cu_zno: 2.592867762978138
    gel: 2.5928677629781407
  annotated:
    zno: 1.9934093232132852
    hama: 1.9934093232132883
    hama_cu_zno: 1.9934093232132883
    gel: 1.9934093232132852
  compare_raw:
    zno: 6.389231399341772
    hama: 6.389231399341772
    hama_cu_zno: 6.389231399341772
    gel: 6.389231399341772
  compare_processed:
    zno: 6.389231399341779
    hama: 6.389231399341772
    hama_cu_zno: 6.389231399341784
    gel: 6.389231399341784

# 整组曲线及归属标签整体平移（mm，正值向上）；不改变内部净距。
group_y_mm: {main: 0.0, annotated: 0.0, compare_raw: 0.0, compare_processed: 0.0}

# 只读迁移几何：锁定旧图的信号显示标尺和原点，不是可调参数。
# 数字来自 schema 1 原图实测；改间距时只平移，空间不足绝不自动缩放。
layout_reference:
  main:
    gap_data: 45.0
    lift_mm: 0.0
    axis_bottom_data: 42.5
    units_per_mm: 17.35530081499932
  annotated:
    gap_data: 55.0
    lift_mm: 0.5
    axis_bottom_data: 38.704539288663895
    units_per_mm: 27.59092142267221
  compare_raw:
    gap_data: 45.0
    lift_mm: 0.0
    axis_bottom_data: 42.5
    units_per_mm: 7.043100677905629
  compare_processed:
    gap_data: 45.0
    lift_mm: 0.0
    axis_bottom_data: 42.5
    units_per_mm: 7.043100677905627

# ── 图例 ─────────────────────────────────────────────────────────────────────
legend_cols: 2             # 整数，范围 1–3。列数改变图例框宽高，不自动缩放谱线。
legend_anchor_x: 0.98      # 范围 0.0–1.0（0=左，1=右）。图例水平锚点。太靠左会压住 y 轴标题
                           # （阻断项会报）。**纵向固定在顶部**：纵向预留量是按"图例占顶部"算的，
                           # 图例挪到下面会让预留与实际不符，所以没开这个旋钮。

# ── 坐标轴与刻度 ─────────────────────────────────────────────────────────────
axis_font_pt: 8.5          # 单位 pt，范围 3.0–12.0。轴标题（粗体；Wavenumber 里的 cm⁻¹ 含上标）。
                           # 改大 → 刻度数字可能撞上轴标题（阻断项会报）。
tick_font_pt: 8.0          # 单位 pt，范围 3.0–12.0。刻度数字。只影响刻度行高。
note_font_pt: 6.5          # 单位 pt，范围 3.0–12.0。对照版左上角那行小注（只出现在 raw/processed 那张）。

# ── 线 ───────────────────────────────────────────────────────────────────────
line_width: 0.85           # 单位 pt，范围 0.2–3.0。谱线线宽。只影响观感，不参与布局。
# 坐标框与刻度线的线宽**故意不在这里**：由 figure_style.apply() 的全局 rcParams 定，
# 必须与 NMR/XRD 一致；按图暴露就等于允许三张图长不一样。

# ── 位移（纯显示，不动数据、不参与坐标范围求解）───────────────────────────────
# 结构：`作用域 → 曲线id → 毫米`。**可选**，不写或写 {} = 全 0。正数 = 往上。
# 四个输出版本各有作用域，改论文主图不会顺手改掉 SI 对照图。
# 位移排在全部布局求解之后：它不改数据、不改 ylim，任何 dpi 下都是同一个毫米数。
# 位移大到把曲线顶出坐标框或撞进归属标签时，`--strict` 会报阻断项并拒绝发布。
#
# **下面每个作用域与曲线都列好了**：取消注释、改数字即可
# shifts_mm:
#   main:
#     ha: 0.0  zno: 0.0  hama: 0.0  hama_cu_zno: 0.0  gel: 0.0
#   annotated:
#     ha: 0.0  zno: 0.0  hama: 0.0  hama_cu_zno: 0.0  gel: 0.0
#   compare_raw:
#     ha: 0.0  zno: 0.0  hama: 0.0  hama_cu_zno: 0.0  gel: 0.0
#   compare_processed:
#     ha: 0.0  zno: 0.0  hama: 0.0  hama_cu_zno: 0.0  gel: 0.0
shifts_mm: {}
