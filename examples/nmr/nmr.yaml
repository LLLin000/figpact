# Fig.2 NMR 叠谱 —— 排版参数（唯一入口）
#
# 改这张图只改这里，不要改 08 NMR.py。
# 未知 key、缺 key、非数字、NaN/Inf、超范围一律直接报错——不设代码内默认值，
# 否则同一个量会有两个权威。
#
# **不在这里、也永远不会进来的东西**：
#   * 谱图显示窗（0–10.5 ppm）——改它会藏掉峰，是"这张图回答什么"的一部分；
#   * `PEAK_MAX_NORM`（溶质归一化标尺）——它同时决定峰的相对幅度与溶剂峰截顶阈值，
#     是科学量。让它可调 = 让 Agent 能改数据的相对高度；
#   * 样品-文件对应、溶剂参考值、峰归属模板——那些是论文的解释本身。

schema_version: 1

# 标注里要不要带 ppm 后缀（true/false）。**只改显示格式**：归属文字永远是
# 模板里的基团名，ppm 是算法检测出来的补充。关掉能让标签窄约 40%，
# 横向压力大减；纵向层高不变。
show_ppm: false

# ── 画布 ──────────────────────────────────────────────────────────────────
canvas_w_mm: 48.0
canvas_h_mm: 48.0

# ── 纵向布局 ──────────────────────────────────────────────────────────────
layer_gap: 55.0       # 相邻谱层基线间距（数据单位；峰高标尺 22）
top_headroom: 140.0   # 顶部预留（图例 + 顶层峰标注）。**固定值，不是实测预留**——
                      # 这是与 FTIR 的差别：FTIR 的预留量由实测图例/标签高度拼出来，
                      # NMR 这里仍是一个常数。收小它 → 图例与顶层标注挤在一起。
label_lift: 2.4       # 峰标注距本层峰顶的净空（数据单位）
# ── 标注自动避让参数 ────────────────────────────────────────────────────────
label_min_gap_mm: 2.0  # 标注间最小净空（mm）。调大：标签横向排布更稀疏，防止相邻标签互相粘连重叠；调小：允许标签更紧凑。影响所有谱层的诊断峰标注。
label_max_dx_mm: 4.0   # 自动避让允许的最大横向位移（mm，屏幕向左或向右）。调大：允许避让引擎向两侧平移更远以躲避冲突；调小：约束标签严格留在峰位正上方。影响所有诊断峰标注与引线。
label_lanes: 3         # 允许的最大排布层数（整数，1–5）。调大：允许在纵向启用更多避让层高，避免同层拥挤；调小：限制避让层数，防止标注过高顶入上层谱线。影响所有诊断峰标注。
# ── 文字 ──────────────────────────────────────────────────────────────────
peak_font_pt: 6.0     # 诊断峰标注（含 OCH₃/NH₂ 等下标）
legend_font_pt: 6.0   # 图例
note_font_pt: 5.5     # `//` 截顶标记
axis_font_pt: 8.5     # 轴标题（粗体）
tick_font_pt: 8.0     # 刻度数字

# ── 线 ────────────────────────────────────────────────────────────────────
line_width: 0.75      # 谱线线宽（pt）
# 坐标框与刻度线的线宽故意不在这里：由 figure_style.apply() 的全局 rcParams 定，
# 必须与 FTIR/XRD 一致；按图暴露就等于允许三张图长不一样。

# ── 图例 ──────────────────────────────────────────────────────────────────
legend_cols: 2
legend_anchor_x: 0.98

# ── 逐样品显示位移（mm）────────────────────────────────────────────────────
# 结构：`作用域 → 样品id → 毫米`。可选，不写 = 全 0。本脚本只有一个输出版本，
# 作用域恒为 main（gid 里也带这一段，与 FTIR 同一套命名）。
#
# **与 FTIR 的关键差别**：NMR 的位移一次动**一组** artist——该样品的谱线、
# 基线、`//` 标记、以及锚定在它上面的峰标注与引线。只动曲线会让标注留在原地。
#
# 例：把第三层 Van-NH₂ 整体上移 1.5 mm
# shifts_mm:
#   main:
#     vannh2: 1.5
shifts_mm: {}

# ── 逐标注微调（mm）────────────────────────────────────────────────────────
# 结构：`作用域 → 标注gid → [dx, dy]`。可选，不写 = 全 0。
# dx 以**屏幕向右**为正、dy 以**向上**为正（与 shifts_mm 同一套）；作用域隔离同上。
# 位移后的位置**照样过碰撞检查**，所以微调绕不过 QA。
#
# **下面 7 个标注都列好了**：取消注释、改数字即可
# peak_label_shifts_mm:
#   main:
#     peak.vancho.9p83: [0, 0]      # –CHO
#     peak.vancho.3p91: [0, 0]      # Ar–OCH$_3$
#     peak.vancho.3p68: [0, 0]      # –COOCH$_3$
#     peak.vanoh.4p62: [0, 0]      # –CH$_2$OH
#     peak.vannh2.3p03: [0, 0]      # –CH$_2$NH$_2$
#     peak.hama.6p18: [0, 0]      # =CH$_2$ (MA)
#     peak.hama.2p02: [0, 0]      # –COCH$_3$ (HA)
peak_label_shifts_mm: {}
