# ══════════════════════════════════════════════════════════════════════════════
# Fig.2 XRD —— 排版参数（唯一入口）
#
# 改这张图**只改这里**，不要改 plot_xrd.py。
# 未知 key、缺 key、非数字、NaN/Inf、超范围一律直接报错——不设代码内默认值，
# 否则同一个量会有两个权威。
#
# **不在这里、也永远不会进来的东西**（LOCKED_SCIENCE）：
#   * 显示窗 10–80°、叠放等距 2.40、ALS 基线 (2e7/0.01/15)、SG 平滑 (7/2 阶)、
#     逐谱窗内归一、ZnO 五峰位置 [31.77, 36.25, 47.54, 56.60, 62.86] 与
#     (100)/(101)/(102)/(110)/(103) 归属——改任一值都是改科学，不是排版。
#
# data_dir 说明：本文件是便携默认，故意留空。RenderSession 跑真实数据时，
# 用一份**临时 config**把 data_dir 指向真实外部 Rigaku .txt 目录
# （含 1.txt..5.txt）；data_dir 为空时 load_science 明确报错，不猜路径。
# ══════════════════════════════════════════════════════════════════════════════

schema_version: 2

# ── 科学输入（非排版；LOCKED_SCIENCE）────────────────────────────────────────
data_dir: ""               # 外部 Rigaku .txt 目录；便携默认留空（缺席即报错）

canvas_w_mm: 41.0          # 单位 mm，范围 20–200。拼版里的**实际占位尺寸**（源 XRD_CANVAS）。
canvas_h_mm: 46.13444575910199  # 同上（源逐字值；可编辑范围不变）。

# ── 文字 ─────────────────────────────────────────────────────────────────────
axis_font_pt: 8.17        # 轴标题（粗体；2θ (°) 无上下标）——源逐字值
tick_font_pt: 7.69        # 刻度数字 —— 源逐字值
legend_font_pt: 5.29      # 图例样品名 —— 源逐字值
hkl_font_pt: 5.29         # 五个 (hkl) 标注（无上下标）—— 源逐字值
hkl_lift_mm: 0.0          # 标注带整体抬升（mm，0–10）；源为 0，只整体上移基线，不改峰位

# ── 线 ───────────────────────────────────────────────────────────────────────
line_width: 0.82           # 谱线线宽（pt，0.2–3.0；源逐字锁定值）
# 坐标框与刻度线的线宽**故意不在这里**：由 figure_style.apply() 的全局 rcParams 定，
# 必须与 FTIR/NMR 一致；按图暴露就等于允许三张图长不一样。

# ── 图例 ─────────────────────────────────────────────────────────────────────
legend_cols: 2             # 整数，范围 1–3。
legend_anchor_x: 0.98      # 范围 0.0–1.0（0=左，1=右）。纵向固定在顶部。

# ── 逐曲线显示位移（mm；纯显示，不动数据）─────────────────────────────────────
# 结构：`作用域 → 曲线id → 毫米`。可选，不写 = 全 0。本图只有一个输出版本，
# 作用域恒为 main（gid 里也带这一段，与 FTIR/NMR 同一套命名）。
# 曲线 id = 样品编号字符串：1=HA, 2=ZnO, 3=HAMA, 4=HAMA/Cu2+/ZnO, 5=HA+复合凝胶。
#
# 例：把 ZnO 参考谱整体上移 1.0 mm
# offsets_mm:
#   main:
#     2: 1.0
offsets_mm: {}

# ── 整组平移（mm，正值向上）──────────────────────────────────────────────────
group_y_mm: {main: 0.0}    # 全部谱线及标注整体平移；不改变内部相对位置。

# ── 只读迁移几何 ─────────────────────────────────────────────────────────────
layout_reference: {main: {}}
