# 原生四联显微图夹具配置：字段与 tests/fixtures/native_panels.SCHEMA 一一对应，缺一个就报错。
# 所有长度都是**物理毫米**：四块面板的位置由「左/下外边距 + 列/行 × (面板边长 + 缝宽)」算出来，
# 不是"看起来差不多"。右/上留白是**栅格之外还剩下的净空**（见 margin_right_mm / margin_top_mm）。
schema_version: 1
# 画布恰好等于「栅格 + 四条留白」：88.4 = 10 + 2×31.2 + 6 + 10，74.0 = 10 + 2×24 + 6 + 10。
# 一块空地都不多留：contain 关系的四条净空就都是 10 mm，改一个数字立刻看得见。
canvas_w_mm: 88.4
canvas_h_mm: 74.0
render_dpi: 300
margin_left_mm: 10.0
margin_bottom_mm: 10.0
# 右/上留白是**声明的最小净空**（DERIVED）：画布比栅格多出来的那几毫米必须不少于它。
margin_right_mm: 10.0
margin_top_mm: 10.0
# 面板框：31.2 / 24.0 = 1.3，与画幅像素比例 260×200 **逐位一致**，否则显微图被拉伸。
panel_w_mm: 31.2
panel_h_mm: 24.0
# 面板之间的缝宽（mm）：x 缝只在右列（b、d）上是位移，y 缝只在上排（c、d）上是位移。
gap_x_mm: 6.0
gap_y_mm: 6.0
# 面板字母的字号与内缩（mm）：字母锚在面板左上角，内缩量是**真实毫米显示位移**。
letter_font_pt: 8.0
letter_inset_x_mm: 2.0
letter_inset_y_mm: 2.0
# 比例尺线宽（pt）：只改粗细，不改长度——长度由下面两个受保护语义决定。
scale_bar_lw_pt: 1.6
# 面板画幅比例（受保护）：260/200 = 1.3。改它 = 换了一张图在说什么，不是排版。
panel_aspect: 1.3
# 每个面板的裁切窗口宽度（µm，受保护）：= 像素数 × 每像素物理尺寸。
# 整幅视野 = 全像素，四张图视野宽度各不相同，这正是"每张图看多大一块样品"的声明。
panel_field_um:
  a: 52.0
  b: 26.0
  c: 13.0
  d: 104.0
# 比例尺代表的物理长度（µm，受保护）：显示长度 = scale_bar_um / 视野宽度 × 面板显示宽度。
scale_bar_um: 10.0
