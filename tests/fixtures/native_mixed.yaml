# 原生混合夹具配置：字段与 tests/fixtures/native_mixed.SCHEMA 一一对应，缺一个就报错。
# 所有长度都是**物理毫米**：面板带由边距 + 面板宽度 + panel_gap_mm 精确算出来。
schema_version: 1
# 画布比"面板带 + 两条预留带"宽/高 6 mm：留一点余量，contain 关系仍成立。
canvas_w_mm: 152.0
canvas_h_mm: 70.0
render_dpi: 300
# 面板贴左边距/下边距排布；上/右两条预留带只保证 containment 余量。
margin_left_mm: 20.0
margin_bottom_mm: 14.0
margin_top_mm: 10.0
margin_right_mm: 12.0
# 两个面板共用这个高度；图像面板宽度被视野纵横比锁死 = 1.3 × 40 = 52 mm。
panel_h_mm: 40.0
curve_panel_w_mm: 56.0
image_panel_w_mm: 52.0
panel_gap_mm: 6.0
axis_font_pt: 7.5
tick_font_pt: 6.5
letter_font_pt: 7.5
line_width: 0.8
scale_bar_lw_pt: 1.2
# 面板字母距面板左边框 / 上边框的真实毫米内缩（只有 main 有字母）。
letter_inset_x_mm: 1.5
letter_inset_y_mm: 1.0
# 曲线整体抬升：纯毫米显示位移，数据坐标一个字节都不动。
curve_lift_mm: 0.0
# 受保护的科学语义：与 fixture_data 里的视野/比例尺/像素纵横比必须逐值一致。
image_field_width_um: 52.0
scale_bar_um: 10.0
panel_aspect: 1.3
